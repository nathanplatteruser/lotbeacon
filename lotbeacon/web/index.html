<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LotBeacon · Messenger Copilot</title>
<style>
/* ---- Design tokens: Ford chrome (deep Ford Blue, white surfaces, pill controls) + Messenger conversation (grey/blue bubbles) ---- */
:root{
  --ford:#00095B; --ford-2:#0A1E8C; --ford-ink:#ffffff;
  --msgr:#0084FF; --msgr-2:#00B2FF; --msgr-soft:#E7F0FF;
  --bg:#F4F5F7; --surface:#FFFFFF; --surface-2:#F0F2F5; --line:#E4E6EB; --line-strong:#CED0D4;
  --ink:#050505; --ink-2:#45474D; --ink-3:#65676B;
  --green:#31A24C; --green-soft:#E6F4EA; --yellow:#C77700; --yellow-soft:#FFF3DF; --orange:#D84A10; --orange-soft:#FDE8DF; --red:#D93025; --red-soft:#FCE8E6;
  --in:#E4E6EB; --in-ink:#050505; --out:linear-gradient(135deg,#0084FF 0%,#00B2FF 100%); --out-ink:#fff;
  --radius:12px; --shadow:0 1px 2px rgba(0,0,0,.08),0 2px 12px rgba(0,9,91,.06);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#18191A; --surface:#242526; --surface-2:#3A3B3C; --line:#3E4042; --line-strong:#4E4F50;
  --ink:#E4E6EB; --ink-2:#B0B3B8; --ink-3:#8A8D91;
  --ford:#0B1470; --msgr-soft:#1B2A44;
  --green:#45BD62; --green-soft:#1E3A26; --yellow:#F0A742; --yellow-soft:#3D2F14; --orange:#F0764A; --orange-soft:#42261A; --red:#F28B82; --red-soft:#44201F;
  --in:#3A3B3C; --in-ink:#E4E6EB;
  --shadow:0 1px 2px rgba(0,0,0,.5);
}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,textarea:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--msgr);outline-offset:2px}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}
.cond{font-weight:700;letter-spacing:.04em}

/* ---- Header: Ford Blue bar ---- */
header{display:flex;align-items:center;gap:18px;padding:0 20px;height:56px;background:var(--ford);color:var(--ford-ink)}
header h1{margin:0;font-size:20px;font-weight:700;letter-spacing:.02em;display:flex;align-items:center;gap:10px}
header h1 .mark{width:28px;height:28px;border-radius:50%;background:#fff;color:var(--ford);display:grid;place-items:center;font-size:15px;font-weight:800}
header h1 b{font-weight:400;opacity:.85}
header .sub{font-size:13px;opacity:.8}
header .right{margin-left:auto;display:flex;gap:14px;align-items:center;font-size:12px;opacity:.9}
header select{font:inherit;font-size:13px;background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:5px 12px}
header select option{color:#000}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:600;letter-spacing:.02em}
.pill.green{background:var(--green-soft);color:var(--green)} .pill.yellow{background:var(--yellow-soft);color:var(--yellow)} .pill.orange{background:var(--orange-soft);color:var(--orange)} .pill.red{background:var(--red-soft);color:var(--red)} .pill.grey{background:var(--surface-2);color:var(--ink-3)}

/* ---- App grid ---- */
.app{display:grid;grid-template-columns:320px 1fr 360px;height:calc(100vh - 56px);gap:0}
@media (max-width:1100px){.app{grid-template-columns:280px 1fr}.side{display:none}}

/* ---- Inbox: Messenger list ---- */
.inbox{background:var(--surface);border-right:1px solid var(--line);overflow-y:auto}
.inbox h2{margin:0;padding:16px 16px 10px;font-size:22px;font-weight:700;display:flex;justify-content:space-between;align-items:baseline}
.inbox h2 span:last-child{font-size:13px;color:var(--ink-3);font-weight:500}
.lead{display:grid;grid-template-columns:48px 1fr auto;grid-template-rows:auto auto auto;gap:1px 12px;width:100%;text-align:left;padding:10px 12px;border-radius:var(--radius);margin:0 8px 2px;width:calc(100% - 16px);align-items:center}
.lead:hover{background:var(--surface-2)} .lead[aria-current="true"]{background:var(--msgr-soft)}
.avatar{grid-row:1/4;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:17px;position:relative}
.avatar .dot{position:absolute;right:0;bottom:0;width:13px;height:13px;border-radius:50%;background:var(--green);border:2px solid var(--surface)}
.lead .n{font-weight:600;font-size:15px}
.lead .score{grid-column:3;grid-row:1;font-size:13px;font-weight:700;color:var(--ford);font-variant-numeric:tabular-nums;background:var(--msgr-soft);padding:2px 8px;border-radius:999px}
.lead .v{grid-column:2;color:var(--ink-3);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lead .ago{grid-column:3;grid-row:2;font-size:12px;color:var(--ink-3);justify-self:end}
.lead .st{grid-column:2/4;font-size:11px;color:var(--ink-3);display:flex;gap:6px;align-items:center;text-transform:capitalize}

/* ---- Thread ---- */
.main{display:flex;flex-direction:column;min-width:0;overflow:hidden;background:var(--surface)}
.thread-head{padding:10px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;flex-wrap:wrap;box-shadow:0 1px 0 var(--line)}
.thread-head .avatar{grid-row:auto;width:40px;height:40px;font-size:15px}
.thread-head .who{display:flex;flex-direction:column}
.thread-head h2{margin:0;font-size:17px;font-weight:700}
.thread-head .state{font-size:12px;color:var(--ink-3);text-transform:capitalize}
.thread-head .tools{margin-left:auto;display:flex;gap:8px}
.btn{white-space:nowrap;border:1.5px solid var(--ford);border-radius:999px;padding:8px 18px;font-weight:600;font-size:14px;background:var(--surface);color:var(--ford)}
.btn.primary{background:var(--ford);border-color:var(--ford);color:#fff}
.btn.primary:hover{background:var(--ford-2)}
.btn.danger{border-color:var(--red);color:var(--red)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn.on{background:var(--red-soft);border-color:var(--red);color:var(--red)}
.convo{flex:1;overflow-y:auto;padding:18px 20px;display:flex;flex-direction:column;gap:6px;background:var(--surface)}
.msg{max-width:62%;padding:9px 13px;border-radius:18px;position:relative;font-size:15px;line-height:1.35}
.msg.in{background:var(--in);color:var(--in-ink);align-self:flex-start;border-bottom-left-radius:6px}
.msg.out{background:var(--out);color:var(--out-ink);align-self:flex-end;border-bottom-right-radius:6px}
.msg .t{display:block;font-size:10px;opacity:.65;margin-top:4px}
.msg.hl{box-shadow:0 0 0 3px var(--msgr)}

/* ---- Funnel tracker (pizza-tracker style) ---- */
.tracker{padding:14px 20px 10px;border-bottom:1px solid var(--line);background:var(--surface)}
.tracker .bar{display:grid;grid-template-columns:repeat(9,1fr);gap:4px}
.tracker .seg{height:10px;border-radius:999px;background:var(--surface-2);position:relative;overflow:hidden}
.tracker .seg.done{background:var(--ford)}
.tracker .seg.cur{background:var(--msgr)}
.tracker .seg.cur::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);animation:sweep 1.6s linear infinite}
.tracker .seg.reached{background:var(--line-strong)}
@keyframes sweep{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
.tracker .labels{display:grid;grid-template-columns:repeat(9,1fr);gap:4px;margin-top:6px}
.tracker .labels span{font-size:10.5px;line-height:1.2;color:var(--ink-3);text-align:center;letter-spacing:.01em}
.tracker .labels span.done{color:var(--ford);font-weight:600}
.tracker .labels span.cur{color:var(--msgr);font-weight:700}
.tracker .status{display:flex;align-items:center;gap:10px;margin-top:8px;font-size:13px}
.tracker .status b{color:var(--ford)}
.tracker .paused{background:var(--yellow-soft);color:var(--yellow);padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600}
.tracker .paused.stop{background:var(--red-soft);color:var(--red)}
.tracker select{margin-left:auto;font:inherit;font-size:12px;padding:5px 10px;border:1.5px solid var(--line-strong);border-radius:999px;background:var(--surface);color:var(--ink)}
.move{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;padding:12px 16px;border-radius:var(--radius);font-size:15px;font-weight:600}
.move .tag{font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:800;padding:4px 10px;border-radius:999px;background:#fff;color:var(--ford)}
.move.approve{background:var(--green-soft);color:var(--green)} .move.you{background:var(--orange-soft);color:var(--orange)} .move.fix{background:var(--red-soft);color:var(--red)} .move.stop{background:var(--red-soft);color:var(--red)} .move.wait,.move.done{background:var(--surface-2);color:var(--ink-2)}
.voice .why{font-size:11px;color:var(--ink-3);max-width:220px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* ---- Momentum sparkline (status colors: good / warning / critical) ---- */
.spark{display:inline-block;vertical-align:middle}
.spark .base{stroke:var(--line);stroke-width:1}
.spark .ln{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.spark .ar{opacity:.18}
.spark .pt{stroke:var(--surface);stroke-width:1.5}
.spark.up .ln,.spark.up .pt{stroke:var(--green)} .spark.up .ar,.spark.up .pt{fill:var(--green)}
.spark.flat .ln,.spark.flat .pt{stroke:var(--yellow)} .spark.flat .ar,.spark.flat .pt{fill:var(--yellow)}
.spark.down .ln,.spark.down .pt{stroke:var(--red)} .spark.down .ar,.spark.down .pt{fill:var(--red)}
.mom{display:flex;align-items:center;gap:10px;margin-left:auto;font-size:12px;color:var(--ink-2)}
.mom b{font-weight:700}
.mom.up b{color:var(--green)} .mom.flat b{color:var(--yellow)} .mom.down b{color:var(--red)}
.lead .mom-mini{grid-column:3;grid-row:3;justify-self:end;display:flex;align-items:center;gap:4px;font-size:10px}
.lead .mom-mini .arrow{font-weight:800}
.lead .mom-mini.up .arrow{color:var(--green)} .lead .mom-mini.flat .arrow{color:var(--yellow)} .lead .mom-mini.down .arrow{color:var(--red)}
/* ---- Ghost / silence + notes ---- */
.msg.note{align-self:center;background:transparent;color:var(--ink-3);font-size:12px;padding:2px 10px;max-width:90%;text-align:center}
.ghost{align-self:center;max-width:90%;text-align:center;color:var(--ink-3);font-size:13px;padding:10px 14px;border:1.5px dashed var(--line-strong);border-radius:var(--radius);background:var(--surface-2)}
.ghost b{color:var(--ink-2)}
.ghost .row{display:flex;gap:8px;justify-content:center;margin-top:10px;flex-wrap:wrap}
.ghost .btn{padding:6px 14px;font-size:13px}
.ghost select{font:inherit;font-size:13px;padding:6px 12px;border:1.5px solid var(--ford);border-radius:999px;background:var(--surface);color:var(--ford);font-weight:600}
.ghost .demo{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin-top:8px}
/* ---- Composer ---- */
.compose{border-top:1px solid var(--line);background:var(--surface);padding:12px 20px 14px;display:flex;flex-direction:column;gap:10px}
.nba{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:10px 14px;background:var(--msgr-soft);border-radius:var(--radius)}
.nba .lab{font-size:11px;color:var(--ford);letter-spacing:.08em;text-transform:uppercase;font-weight:700}
.nba .act{font-weight:700} .nba .why{font-size:12px;color:var(--ink-2)}
.warn{display:flex;flex-direction:column;gap:4px}
.claim{display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:start;padding:6px 12px;border-radius:10px;font-size:12px}
.claim.supported{background:var(--green-soft)} .claim.unsupported,.claim.prohibited{background:var(--red-soft)} .claim.orange{background:var(--orange-soft)}
.claim b{font-weight:600} .claim .q{color:var(--ink-2);font-style:italic}
textarea#draft{width:100%;min-height:80px;border:1.5px solid var(--line-strong);border-radius:20px;padding:12px 16px;background:var(--surface-2);color:var(--ink);font:inherit;resize:vertical}
textarea#draft:focus{background:var(--surface);border-color:var(--msgr)}
textarea#draft.blocked{border-color:var(--red);background:var(--red-soft)}
.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.actions .meta{margin-left:auto;font-size:12px;color:var(--ink-3)}
.blockmsg{font-size:12px;color:var(--red);font-weight:600}
.voice{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-3)}
.voice select{font:inherit;font-size:13px;padding:7px 12px;border:1.5px solid var(--line-strong);border-radius:999px;background:var(--surface);color:var(--ink)}

/* ---- Side: context cards ---- */
.side{border-left:1px solid var(--line);background:var(--bg);overflow-y:auto;padding:14px}
.card{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px;margin-bottom:12px}
.side h3{margin:0 0 8px;font-size:11px;color:var(--ink-3);letter-spacing:.08em;text-transform:uppercase;font-weight:700}
.summary{font-size:14px;color:var(--ink-2)}
.fact{display:grid;grid-template-columns:1fr auto;gap:2px 8px;padding:9px 12px;border-radius:10px;margin-bottom:6px;width:100%;text-align:left;background:var(--surface-2)}
.fact:hover{background:var(--msgr-soft)}
.fact .k{font-size:11px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em}
.fact .val{font-weight:600;grid-column:1}
.fact .conf{font-size:11px;color:var(--ink-3);grid-row:1/3;align-self:center}
.fact .ev{grid-column:1/-1;font-size:11px;color:var(--ford)}
.fact .ev:empty{display:none}
.vcard .name{font-weight:700;font-size:16px;color:var(--ford)}
.vcard .row{display:flex;justify-content:space-between;font-size:13px;color:var(--ink-2);padding:3px 0;border-bottom:1px solid var(--line)}
.vcard .row:last-of-type{border-bottom:0}
.vcard .fresh{margin-top:8px;font-size:11px}
.vcard .fresh.ok{color:var(--green)} .vcard .fresh.bad{color:var(--red)}
.trans{font-size:12px;color:var(--ink-2);padding:5px 0;border-bottom:1px solid var(--line)}
.trans:last-child{border-bottom:0}
.trans b{color:var(--ink)}
.sim{border:1.5px dashed var(--line-strong);box-shadow:none;background:transparent}
.sim textarea{width:100%;min-height:56px;border:1.5px solid var(--line-strong);border-radius:16px;padding:10px 12px;background:var(--surface);color:var(--ink);font:inherit}
.sim .row{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.sim select{font:inherit;font-size:13px;padding:7px 12px;border:1.5px solid var(--line-strong);border-radius:999px;background:var(--surface);color:var(--ink)}
.small{font-size:11px;color:var(--ink-3)}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--ford);color:#fff;padding:9px 16px;border-radius:999px;font-size:13px;opacity:0;transition:opacity .2s;box-shadow:var(--shadow)}
.toast.show{opacity:1}
.empty{padding:40px;text-align:center;color:var(--ink-3)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <h1><span class="mark">L</span>LotBeacon <b>· Messenger Copilot</b></h1>
  <span class="sub" id="dealer">—</span>
  <div class="right"><span id="provider"></span><label>Signed in as <select id="rep"></select></label></div>
</header>

<div class="app">
  <aside class="inbox">
    <h2><span>Priority leads</span><span id="inboxCount"></span></h2>
    <div id="leads"></div>
  </aside>

  <main class="main" id="main">
    <div class="empty">Pick a lead.</div>
  </main>

  <aside class="side" id="side"></aside>
</div>
<div class="toast" id="toast"></div>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let META=null, current=null, detail=null, editing=false;

async function api(path,opts={}){
  const r=await fetch(path,{headers:{'Content-Type':'application/json'},...opts,body:opts.body?JSON.stringify(opts.body):undefined});
  if(!r.ok){let e={};try{e=await r.json();}catch(_){ } throw Object.assign(new Error(e.detail?.message||e.detail||r.statusText),{detail:e.detail});}
  return r.json();
}
function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('show');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('show'),2400);}
function human(sec){let s=Math.max(0,Math.round(sec));const d=Math.floor(s/86400);s-=d*86400;const h=Math.floor(s/3600);s-=h*3600;const m=Math.floor(s/60);s-=m*60;if(d)return `${d}d ${h}h`;if(h)return `${h}h ${m}m`;if(m)return `${m}m ${s}s`;return `${s}s`;}
function ago(iso){if(!iso)return'';return human((Date.now()-new Date(iso))/1000);}
function repId(){return +$('#rep').value;}
const STATE_LABEL=s=>s.replace(/_/g,' ').toLowerCase();
const AV=['#00095B','#0084FF','#7A3E9D','#C2410C','#0F766E','#B91C1C','#4338CA','#A16207'];
function avatar(name,extra=''){const n=(name||'?').trim();const ini=n.split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase();let h=0;for(const c of n)h=(h*31+c.charCodeAt(0))>>>0;return `<span class="avatar" style="background:${AV[h%AV.length]}">${esc(ini)}${extra}</span>`;}

async function loadMeta(){
  META=await api('/api/meta');
  $('#dealer').textContent=META.dealership.name+(META.dealership.hours_today?' · open '+META.dealership.hours_today:'');
  $('#provider').textContent='AI: '+META.provider+' · '+META.rules_version;
  $('#rep').innerHTML=META.reps.map(r=>`<option value="${r.id}">${esc(r.name)} (${r.role})</option>`).join('');
}
async function loadInbox(){
  const list=await api('/api/threads');
  $('#inboxCount').textContent=list.length;
  $('#leads').innerHTML=list.map(t=>`<button class="lead" data-id="${t.id}" aria-current="${t.id===current}">
    ${avatar(t.customer,(Date.now()-new Date(t.last_customer_message_at))<600000?'<i class="dot"></i>':'')}
    <span class="n">${esc(t.customer)}</span><span class="score">${t.priority}</span>
    <span class="v">${esc(t.vehicle||'—')}</span><span class="ago" title="waiting on a reply">${ago(t.last_customer_message_at)}</span>
    <span class="st">${STATE_LABEL(t.lead_state)}${t.risk?` <span class="pill ${t.risk}">${t.risk}</span>`:''}${t.ai_paused?' <span class="pill grey">AI paused</span>':''}${t.ghost?` <span class="pill grey" title="no reply since our last message">quiet ${esc(t.ghost)}</span>`:''}</span>
    ${t.momentum&&t.momentum.series.length?`<span class="mom-mini ${t.momentum.trend}" title="${esc(t.momentum.label)}">${spark(t.momentum,44,16)}<span class="arrow">${ARROW[t.momentum.trend]}</span></span>`:''}
  </button>`).join('');
  if(!current&&list.length){open(list[0].id);}
}
async function open(id){current=id;editing=false;detail=await api('/api/threads/'+id);renderThread();renderSide();document.querySelectorAll('.lead').forEach(l=>l.setAttribute('aria-current',+l.dataset.id===id));}

function renderThread(){
  const d=detail,dr=d.draft;
  const blocked=dr&&(dr.status==='blocked'||dr.risk_level==='red');
  const sent=dr&&dr.status==='sent';
  const elig=d.messaging.eligible;
  $('#main').innerHTML=`
    <div class="thread-head">
      ${avatar(d.customer.name||d.customer.psid)}
      <div class="who"><h2>${esc(d.customer.name||d.customer.psid)}</h2>
      <span class="state"><b>${STATE_LABEL(d.lead_state)}</b> · ${esc(d.priority_reason)}</span></div>
      ${d.customer.opted_out?'<span class="pill red">Do not contact</span>':''}
      ${!elig?`<span class="pill red" title="${esc(d.messaging.reason)}">Send blocked: ${esc(d.messaging.reason)}</span>`:`<span class="pill green">Messaging window open</span>`}
      <div class="tools">
        <button class="btn ${d.ai_paused?'on':''}" id="takeover">${d.ai_paused?'Resume AI':'Take over'}</button>
        <button class="btn" id="confirmAppt" ${d.lead_state==='DO_NOT_CONTACT'?'disabled':''}>Confirm appointment…</button>
      </div>
    </div>
    ${renderTracker(d)}
    <div class="convo" id="convo">${d.messages.map(m=>m.direction==='note'?`<div class="msg note" data-mid="${m.id}">${esc(m.text)} · ${new Date(m.sent_at).toLocaleString()}</div>`:`<div class="msg ${m.direction}" data-mid="${m.id}">${esc(m.text)}<span class="t">${m.author} · ${new Date(m.sent_at).toLocaleString()}</span></div>`).join('')}${renderGhost(d)}</div>
    <div class="compose">
      ${d.your_move?`<div class="move ${d.your_move.kind}"><span class="tag">Your move</span><span>${esc(d.your_move.text)}</span></div>`:''}
      ${dr?`<div class="nba"><span class="lab">Next best action</span><div><div class="act">${esc(humanAction(dr.structured.recommended_action))}</div><div class="why">${esc(dr.structured.nba_reason)}${dr.structured.missing_information?.length?' · still unknown: '+dr.structured.missing_information.join(', '):''}</div></div><span class="pill ${dr.risk_level}">${dr.risk_level}</span></div>`:''}
      ${dr?renderClaims(dr):''}
      ${d.ai_paused?'<div class="small">AI drafting is paused for this thread. Type your own reply — it still goes through the claim check.</div>':''}
      <textarea id="draft" class="${blocked?'blocked':''}" ${sent?'disabled':''} placeholder="${dr&&!dr.text?'No AI draft for this action — write your reply, or hand off.':'Draft…'}">${esc(dr?dr.text:'')}</textarea>
      <div class="actions">
        <button class="btn primary" id="send" ${(!dr||sent||!elig||blocked)?'disabled':''}>${sent?'Sent':'Send'}</button>
        <button class="btn" id="recheck" ${(!dr||sent)?'disabled':''}>Re-check claims</button>
        <label class="voice">Voice <select id="voice" ${sent?'disabled':''}><option value="auto" ${!d.voice_locked?'selected':''}>Auto · ${esc((META.voices.find(v=>v.id===(d.voice||'dealer'))||{}).label||'Dealership default')}</option>${META.voices.map(v=>`<option value="${v.id}" ${d.voice_locked&&v.id===(d.voice||'dealer')?'selected':''} title="${esc(v.tagline)}">${esc(v.label)}</option>`).join('')}</select><span class="why" title="${esc(d.voice_reason||'')}">${esc(d.voice_reason||'')}</span></label>
        ${blocked?'<span class="blockmsg">Blocked — fix the red sentences before sending.</span>':''}
        <span class="meta">${dr?`draft #${dr.id} · ${dr.provider} · ${dr.approval_required?'rep approval required':'auto-eligible'}`:'no draft yet'}</span>
      </div>
    </div>`;
  const convo=$('#convo');convo.scrollTop=convo.scrollHeight;
  $('#takeover').onclick=async()=>{await api(`/api/threads/${d.id}/takeover`,{method:'POST',body:{rep_id:repId(),paused:!d.ai_paused}});toast(d.ai_paused?'AI resumed':'You have the thread');await open(d.id);loadInbox();};
  $('#confirmAppt').onclick=async()=>{const when=prompt('Appointment date/time (e.g. 2026-09-06 14:00). Only confirm what you actually booked in the scheduler.');if(!when)return;try{await api(`/api/threads/${d.id}/appointment`,{method:'POST',body:{rep_id:repId(),starts_at:new Date(when.replace(' ','T')).toISOString()}});toast('Appointment confirmed — "booked" language is now allowed');await open(d.id);loadInbox();}catch(e){toast(e.message);}};
  const fn=$('#fuNext'); if(fn) fn.onclick=async()=>{const r=await api(`/api/threads/${d.id}/followup`,{method:'POST',body:{rep_id:repId(),action:'next'}});toast(r.blocked&&!r.draft?r.message:`Follow-up ${r.stage} drafted — review and send`);await open(d.id);loadInbox();};
  const fs=$('#fuStop'); if(fs) fs.onclick=async()=>{await api(`/api/threads/${d.id}/followup`,{method:'POST',body:{rep_id:repId(),action:'stop'}});toast('Sequence stopped');await open(d.id);};
  const off=$('#offline'); if(off) off.onchange=async e=>{const ch=e.target.value;if(!ch)return;const note=prompt('Quick note (optional):','')??'';await api(`/api/threads/${d.id}/offline`,{method:'POST',body:{rep_id:repId(),channel:ch,note}});toast('Logged — thread no longer reads as ghosted');await open(d.id);loadInbox();};
  const st=$('#stage'); if(st) st.onchange=async e=>{const v=e.target.value;if(!v)return;await api(`/api/threads/${d.id}/state`,{method:'POST',body:{rep_id:repId(),state:v,reason:'rep updated stage'}});toast('Stage updated');await open(d.id);loadInbox();};
  $('#voice').onchange=async e=>{toast('Redrafting in '+e.target.selectedOptions[0].text+'…');await api(`/api/threads/${d.id}/voice`,{method:'POST',body:{rep_id:repId(),voice:e.target.value}});await open(d.id);loadInbox();};
  if(dr){
    $('#recheck').onclick=()=>recheck();
    $('#draft').addEventListener('input',()=>{editing=true;});
    $('#send').onclick=async()=>{
      try{const r=await api(`/api/drafts/${dr.id}/send`,{method:'POST',body:{rep_id:repId(),text:$('#draft').value}});toast(r.demo?.replied?'Sent — customer replied':r.demo?.ghost_hours?`Sent — customer went quiet (${r.demo.ghost_hours}h)`:'Sent (simulated Messenger)');await open(d.id);loadInbox();}
      catch(e){toast(e.message||'Blocked');await open(d.id);if(e.detail?.reason)$('#draft').value=$('#draft').value;}
    };
  }
}
async function recheck(){const dr=detail.draft;const v=await api(`/api/drafts/${dr.id}/edit`,{method:'POST',body:{rep_id:repId(),text:$('#draft').value}});detail.draft=v;renderThread();toast(v.status==='blocked'?'Still blocked':'Claims re-checked: '+v.risk_level);}

function spark(m,w,h){
  if(!m||!m.series||!m.series.length) return '';
  let s=m.series.slice(-8); if(s.length===1) s=[s[0],s[0]];
  const pad=3, W=w-pad*2, H=h-pad*2, n=s.length;
  const x=i=>pad+(n===1?W/2:i*W/(n-1)), y=v=>pad+H-(Math.max(0,Math.min(100,v))/100)*H;
  const pts=s.map((v,i)=>`${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
  const area=`M${x(0).toFixed(1)},${(pad+H).toFixed(1)} L${pts.replace(/ /g,' L')} L${x(n-1).toFixed(1)},${(pad+H).toFixed(1)} Z`;
  const arrow={up:'↗',flat:'→',down:'↘'}[m.trend];
  return `<svg class="spark ${m.trend}" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" role="img" aria-label="${m.label}, score ${m.score}"><title>${m.label} · ${s.join(' → ')}</title><path class="ar" d="${area}"></path><line class="base" x1="${pad}" y1="${pad+H}" x2="${w-pad}" y2="${pad+H}"></line><polyline class="ln" points="${pts}"></polyline><circle class="pt" cx="${x(n-1).toFixed(1)}" cy="${y(s[n-1]).toFixed(1)}" r="3"></circle></svg>`;
}
const ARROW={up:'↗',flat:'→',down:'↘'};
function renderGhost(d){
  const g=d.ghost; if(!g) return '';
  const stage=g.followup_stage||0;
  const nextLabel=stage>=3?'All 3 nudges sent':stage?`Send nudge ${stage+1} of 3`:'Start follow-up sequence';
  return `<div class="ghost">[ <b>${esc(d.customer.name||'Customer')}</b> has not responded in <b>${esc(g.label)}</b> ]
    <div class="row">
      <button class="btn primary" id="fuNext" ${stage>=3?'disabled':''}>${nextLabel}</button>
      ${stage?'<button class="btn" id="fuStop">Stop sequence</button>':''}
      <select id="offline"><option value="">I reached them offline…</option><option value="call">📞 Called them</option><option value="text">💬 Texted them</option><option value="email">✉️ Emailed them</option><option value="visit">🚗 They came in</option></select>
    </div>
    <div class="demo">${g.simulated?'demo · simulated silence':'real elapsed time'} · follow-ups are never automatic — your call</div></div>`;
}
function renderTracker(d){
  const f=d.funnel; if(!f) return '';
  const segs=f.stages.map((s,i)=>`<div class="seg ${i<f.current?'done':i===f.current?'cur':i<=f.furthest?'reached':''}"></div>`).join('');
  const labs=f.stages.map((s,i)=>`<span class="${i<f.current?'done':i===f.current?'cur':''}">${esc(s.label)}</span>`).join('');
  const cur=f.stages[f.current]?.label||'';
  const stop=['LOST','DO_NOT_CONTACT'].includes(f.state);
  const opts=[['APPOINTMENT_SET','Appointment set'],['ARRIVED','Showed up'],['SOLD','Sold'],['NURTURE','Follow up later'],['LOST','Lost / went elsewhere'],['HUMAN_REQUIRED','Needs a person']];
  return `<div class="tracker"><div class="bar">${segs}</div><div class="labels">${labs}</div>
    <div class="status"><span>Stage ${f.current+1} of ${f.stages.length}: <b>${esc(cur)}</b></span>${f.paused&&f.paused!=='null'?`<span class="paused ${stop?'stop':''}">${esc(f.paused)}</span>`:''}
    ${d.momentum&&d.momentum.series.length?`<span class="mom ${d.momentum.trend}" title="Propensity to show for the visit, one point per customer message">${spark(d.momentum,120,30)}<span><b>${ARROW[d.momentum.trend]} ${esc(d.momentum.label)}</b><br><span class="small">${d.momentum.series.length} message${d.momentum.series.length>1?'s':''} · score ${d.momentum.score}${d.momentum.delta?` (${d.momentum.delta>0?'+':''}${d.momentum.delta})`:''}</span></span></span>`:''}
    <select id="stage" aria-label="Update stage"><option value="">Update stage…</option>${opts.map(([k,l])=>`<option value="${k}">${l}</option>`).join('')}</select></div></div>`;
}
function humanAction(a){return({answer_availability:'Confirm availability, then ask one useful question',invite_test_drive:'Invite for a test drive',resolve_vehicle_questions:'Answer the vehicle questions',ask_qualifying_question:'Ask one qualifying question',answer_price:'Share the verified listed price',route_financing_to_human:'Hand financing to the finance team',route_trade_to_human:'Hand trade value to the appraiser',route_price_objection_to_human:'Hand pricing to the sales manager',offer_alternatives:'Offer matching alternatives',acknowledge_and_close:'Acknowledge and stop selling',offer_reschedule:'Offer a new day — keep the visit alive',route_hold_to_human:'Hand the hold request to the sales manager',route_warranty_to_human:'Pull real warranty details, then answer',route_delivery_to_human:'Check delivery policy, then answer',follow_up_1:'Follow-up nudge 1 of 3',follow_up_2:'Follow-up nudge 2 of 3',follow_up_3:'Follow-up nudge 3 of 3 (last)',escalate_opt_out:'Suppress — customer opted out',human_takeover:'Rep takes over'})[a]||a;}

function renderClaims(dr){
  const cs=dr.validation?.claims||[];
  if(!cs.length&&dr.text)return'<div class="small">No factual claims detected in this draft.</div>';
  return `<div class="warn">${cs.map(c=>`<div class="claim ${c.verdict}${c.risk==='orange'?' orange':''}"><b>${c.verdict==='supported'?'✓':'⚠'} ${esc(c.kind.replace(/_/g,' '))}</b><span><span class="q">“${esc(c.text)}”</span>${c.source?` — <span class="mono">${esc(c.source)}</span>`:''}${c.note?` — ${esc(c.note)}`:''}</span></div>`).join('')}</div>`;
}

function renderSide(){
  const d=detail,v=d.vehicle;
  $('#side').innerHTML=`
    <div class="card"><h3>AI summary</h3><div class="summary">${esc(d.summary||'—')}</div><div class="small">${esc(d.summary_version)}</div></div>
    <div class="card"><h3>What we know <span class="small">(tap a fact → source message)</span></h3>
    ${d.facts.length?d.facts.map(f=>`<button class="fact" data-mid="${f.evidence?.message_id||''}" data-fid="${f.id}" title="Click to see evidence · right-click to correct"><span class="k">${esc(f.key.replace(/_/g,' '))}</span><span class="conf">${f.corrected?'rep':Math.round(f.confidence*100)+'%'}</span><span class="val">${esc(f.value)}</span><span class="ev">${f.evidence?'“'+esc(f.evidence.text.slice(0,70))+(f.evidence.text.length>70?'…':'')+'”':'rep-entered'}</span></button>`).join(''):'<div class="small">Nothing extracted yet. Unknown stays unknown.</div>'}</div>
    <div class="card vcard"><h3>Vehicle</h3>
    ${v?`<div><div class="name">${v.year} ${esc(v.make)} ${esc(v.model)} ${esc(v.trim)}</div>
      <div class="row"><span>Stock / VIN</span><span class="mono">${esc(v.stock_number)} · …${esc(v.vin.slice(-6))}</span></div>
      <div class="row"><span>Color</span><span>${esc(v.color)}</span></div>
      <div class="row"><span>Mileage</span><span class="mono">${v.mileage.toLocaleString()}</span></div>
      <div class="row"><span>Price</span><span class="mono">$${v.price.toLocaleString()}</span></div>
      <div class="row"><span>Status</span><span class="pill ${v.status==='available'?'green':'red'}">${v.status}</span></div>
      <div class="fresh ${v.fresh?'ok':'bad'}">${v.fresh?'✓':'⚠'} ${esc(v.source)} · verified ${ago(v.retrieved_at)} ago${v.fresh?'':' — STALE, availability/price claims blocked'}</div></div>`:'<div class="small">No specific unit resolved yet.</div>'}</div>
    <div class="card"><h3>State history</h3>
    ${d.transitions.map(t=>`<div class="trans"><b>${STATE_LABEL(t.from)} → ${STATE_LABEL(t.to)}</b><br>${esc(t.reason)} · ${esc(t.actor)}</div>`).join('')||'<div class="small">—</div>'}</div>
    <div class="card sim"><h3>Simulate customer message</h3>
      <textarea id="simText" placeholder="Type what ${esc(d.customer.name||'the customer')} says next…"></textarea>
      <div class="row"><button class="btn" id="simSend">Receive message</button>
        <select id="simInv"><option value="">Inventory event…</option>${v?`<option value="sold">Mark ${esc(v.model)} sold</option><option value="pending">Mark ${esc(v.model)} pending</option><option value="available">Mark ${esc(v.model)} available</option><option value="stale">Make feed stale (3h old)</option>`:''}</select></div>
      <div class="small">Air-gapped demo controls. In production these come from Messenger and the inventory feed.</div></div>`;
  document.querySelectorAll('.fact').forEach(b=>{
    b.onclick=()=>{const mid=b.dataset.mid;document.querySelectorAll('.msg').forEach(m=>m.classList.toggle('hl',m.dataset.mid===mid));const el=document.querySelector(`.msg[data-mid="${mid}"]`);if(el)el.scrollIntoView({block:'center'});};
    b.oncontextmenu=async e=>{e.preventDefault();const nv=prompt('Correct this fact (empty = remove):',b.querySelector('.val').textContent);if(nv===null)return;await api(`/api/facts/${b.dataset.fid}/correct`,{method:'POST',body:{rep_id:repId(),value:nv||null}});toast('Memory corrected');open(d.id);};
  });
  $('#simSend').onclick=async()=>{const t=$('#simText').value.trim();if(!t)return;await api('/webhook/messenger',{method:'POST',body:{page_id:META.dealership.page_id,psid:d.customer.psid,text:t,display_name:d.customer.name}});toast('Message received → pipeline ran');await open(d.id);loadInbox();};
  $('#simInv').onchange=async e=>{const val=e.target.value;if(!val||!v)return;await api('/api/inventory/'+v.stock_number,{method:'POST',body:val==='stale'?{stale:true}:{status:val}});toast('Inventory updated — re-check the draft');e.target.value='';await open(d.id);};
}

document.addEventListener('click',e=>{const l=e.target.closest('.lead');if(l)open(+l.dataset.id);});
(async()=>{await loadMeta();await loadInbox();setInterval(loadInbox,15000);})();
</script>
